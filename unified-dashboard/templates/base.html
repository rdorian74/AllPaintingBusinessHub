<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ hub_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        },
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.running {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }
        .status-dot.stopped {
            background: #ef4444;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .nav-link {
            position: relative;
            transition: all 0.2s;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.2s;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        .nav-link.active {
            color: #a5b4fc;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="text-gray-100">
    <!-- Navigation -->
    <nav class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div>
                        <span class="text-sm text-gray-400">ALL PAINTING LTD</span>
                        <h1 class="text-lg font-semibold text-white -mt-1">Business Hub</h1>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="{{ url_for('dashboard') }}" class="nav-link {% if current_page == 'dashboard' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Dashboard
                    </a>
                    <a href="{{ url_for('bids_page') }}" class="nav-link {% if current_page == 'bids' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Bids
                    </a>
                    <a href="{{ url_for('estimates_page') }}" class="nav-link {% if current_page == 'estimates' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Estimates
                    </a>
                    <a href="{{ url_for('invoices_page') }}" class="nav-link {% if current_page == 'invoices' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Invoices
                    </a>
                    <a href="{{ url_for('followups_page') }}" class="nav-link {% if current_page == 'followups' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Follow-ups
                    </a>
                    <a href="{{ url_for('payroll_page') }}" class="nav-link {% if current_page == 'payroll' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Payroll
                    </a>
                    <a href="{{ url_for('services_page') }}" class="nav-link {% if current_page == 'services' %}active{% endif %} px-4 py-2 text-sm font-medium text-gray-300 hover:text-white">
                        Services
                    </a>
                </div>

                <!-- Status indicator -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 text-sm">
                        <span class="status-dot running"></span>
                        <span class="text-gray-400" id="running-count">{{ running_count }}</span>
                        <span class="text-gray-500">/</span>
                        <span class="text-gray-400" id="total-count">{{ running_count + stopped_count }}</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
        // Toast notification system
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Service control functions
        async function startService(serviceId) {
            try {
                const resp = await fetch(`/api/start/${serviceId}`, { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    showToast(`Started ${serviceId}`, 'success');
                    refreshStatus();
                } else {
                    showToast(`Failed to start ${serviceId}`, 'error');
                }
            } catch (e) {
                showToast(`Error: ${e.message}`, 'error');
            }
        }

        async function stopService(serviceId) {
            try {
                const resp = await fetch(`/api/stop/${serviceId}`, { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    showToast(`Stopped ${serviceId}`, 'success');
                    refreshStatus();
                } else {
                    showToast(`Failed to stop ${serviceId}`, 'error');
                }
            } catch (e) {
                showToast(`Error: ${e.message}`, 'error');
            }
        }

        async function startAllServices() {
            try {
                const resp = await fetch('/api/start-all', { method: 'POST' });
                showToast('Starting all services...', 'success');
                setTimeout(refreshStatus, 2000);
            } catch (e) {
                showToast(`Error: ${e.message}`, 'error');
            }
        }

        async function stopAllServices() {
            try {
                const resp = await fetch('/api/stop-all', { method: 'POST' });
                showToast('Stopping all services...', 'success');
                setTimeout(refreshStatus, 2000);
            } catch (e) {
                showToast(`Error: ${e.message}`, 'error');
            }
        }

        async function refreshStatus() {
            try {
                const resp = await fetch('/api/status');
                const statuses = await resp.json();

                let running = 0;
                let total = 0;

                for (const [serviceId, isRunning] of Object.entries(statuses)) {
                    total++;
                    if (isRunning) running++;

                    // Update status indicators
                    const dot = document.querySelector(`[data-service="${serviceId}"] .status-dot`);
                    const statusText = document.querySelector(`[data-service="${serviceId}"] .status-text`);
                    const startBtn = document.querySelector(`[data-service="${serviceId}"] .btn-start`);
                    const stopBtn = document.querySelector(`[data-service="${serviceId}"] .btn-stop`);

                    if (dot) {
                        dot.className = `status-dot ${isRunning ? 'running' : 'stopped'}`;
                    }
                    if (statusText) {
                        statusText.textContent = isRunning ? 'Running' : 'Stopped';
                        statusText.className = `status-text text-xs ${isRunning ? 'text-green-400' : 'text-red-400'}`;
                    }
                    if (startBtn) {
                        startBtn.disabled = isRunning;
                        startBtn.className = startBtn.className.replace(/opacity-\d+/, isRunning ? 'opacity-50' : 'opacity-100');
                    }
                    if (stopBtn) {
                        stopBtn.disabled = !isRunning;
                        stopBtn.className = stopBtn.className.replace(/opacity-\d+/, !isRunning ? 'opacity-50' : 'opacity-100');
                    }
                }

                // Update header counts
                document.getElementById('running-count').textContent = running;
                document.getElementById('total-count').textContent = total;
            } catch (e) {
                console.error('Failed to refresh status:', e);
            }
        }

        // Auto-refresh status every 10 seconds
        setInterval(refreshStatus, 10000);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
